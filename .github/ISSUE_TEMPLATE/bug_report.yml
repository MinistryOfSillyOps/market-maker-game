name: Bug Report
description: Report a bug in the market-maker game
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the details below so Copilot and contributors can reproduce and fix the issue quickly.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "e.g. When I enter 'b 10', the cash balance goes negative without explanation."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Exact steps to trigger the bug.
      placeholder: |
        1. Run `python3 market_maker_game.py`
        2. Wait for round 1 to display
        3. Enter `b 25`
        4. See error or unexpected output
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behaviour
      description: What should happen instead?
      placeholder: "e.g. Cash should decrease by the ask price × quantity plus fees."
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behaviour
      description: What actually happens? Include any error messages or unexpected output.
      placeholder: |
        Paste terminal output here, e.g.:
        ```
        Cash: $-1,234.00 | Position: +25 shares | ...
        ```
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      description: Which part of the game is affected?
      options:
        - Price generation (next_price)
        - Trade execution (apply_trade)
        - Input parsing (parse_action)
        - Liquidation logic (force_liquidate)
        - Score / PnL calculation
        - Display / formatting
        - CLI arguments
        - Other
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: Python Version
      description: Output of `python3 --version`
      placeholder: "e.g. Python 3.11.4"
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Additional Context
      description: Any other information that may be relevant (seed value used, OS, etc.).
      placeholder: "e.g. Reproducible with `--seed 42 --rounds 5`"
    validations:
      required: false
